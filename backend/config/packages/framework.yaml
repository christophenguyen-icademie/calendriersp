framework:
  secret: '%env(APP_SECRET)%'
  http_method_override: false
  handle_all_throwables: true
  session:
    handler_id: null
    cookie_httponly: true
    cookie_secure: auto
    cookie_samesite: lax
    gc_maxlifetime: 28800
  router:
    utf8: true
  serializer:
    enabled: true
  validation:
    enable_attributes: true
  php_errors:
    log: true
