doctrine:
  dbal:
    url: '%env(resolve:DATABASE_URL)%'
    # PostGIS owns other tables and sequences: schema diffs must leave them intact.
    schema_filter: '~^(?:public\.)?(?:amicale|app_user|secteur|adresse|tournee|tournee_affectation|passage|carnet|recu|campagne|doctrine_migration_versions)$~'
    types:
      uuid: Symfony\Bridge\Doctrine\Types\UuidType
  orm:
    auto_generate_proxy_classes: true
    enable_lazy_ghost_objects: true
    report_fields_where_declared: true
    validate_xml_mapping: true
    naming_strategy: doctrine.orm.naming_strategy.underscore_number_aware
    auto_mapping: true
    mappings:
      App:
        type: attribute
        dir: '%kernel.project_dir%/src/Entity'
        prefix: App\Entity
        alias: App
