# Nginx sur l'hote ; containers Docker accessibles uniquement en boucle locale.
# Adapter 8082 au WEB_PORT du VPS (8080 dans .env.example).
# Le certificat existant doit couvrir les quatre noms de domaine ci-dessous.

server {
    listen 80;
    listen [::]:80;
    server_name mobilesp10.fr www.mobilesp10.fr api-calendriers.mobilesp10.fr amicale-calendriers.mobilesp10.fr;

    return 301 https://$host$request_uri;
}

# MobileSP : export web Expo.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name mobilesp10.fr www.mobilesp10.fr;

    ssl_certificate /etc/letsencrypt/live/mobilesp10.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mobilesp10.fr/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/mobilesp;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# Administration CalendrierSP : front React et API sur la meme origine.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name amicale-calendriers.mobilesp10.fr;

    ssl_certificate /etc/letsencrypt/live/mobilesp10.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mobilesp10.fr/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location ~ ^/api(?:/|$) {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
    }

    location / {
        proxy_pass http://127.0.0.1:8082;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# API publique : les routes Symfony conservent leur prefixe /api.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api-calendriers.mobilesp10.fr;

    ssl_certificate /etc/letsencrypt/live/mobilesp10.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mobilesp10.fr/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
    }
}
